name: Rebuild diário

# "Próximos eventos" e "Eventos recentes"/"Seminários anteriores" são separados
# durante o build, então o site precisa ser reconstruído depois que um encontro
# acontece. Sem isso, o evento continua listado como próximo até o próximo
# push, que costuma acontecer só quando a edição seguinte é publicada.
on:
  schedule:
    - cron: '17 3 * * *' # 00:17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir um build do Pages
        run: |
          curl -sS --fail-with-body --retry 3 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
